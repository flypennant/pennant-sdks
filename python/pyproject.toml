[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pennant-sdk"
version = "1.1.0"
description = "Python client for the Pennant feature-flag evaluate API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pennant" }]
dependencies = []

[project.urls]
Repository = "https://github.com/flypennant/pennant-sdks"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pennant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
