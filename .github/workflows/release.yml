name: Release

# Runs after CI passes on main. Bumps each changed SDK from conventional
# commits, tags <sdk>/vX.Y.Z, creates the GitHub release, and publishes.
# npm uses trusted publishing (OIDC, needs id-token: write and npm >= 11.5.1).
# PyPI and crates.io publish when PYPI_TOKEN or CARGO_REGISTRY_TOKEN is set.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install
        run: |
          npm install -g npm@latest
          npm ci
          python3 -m pip install build twine

      - name: Cut version tags, GitHub releases, and registry publishes
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_PUBLISH: "1"
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: node scripts/release.mjs
