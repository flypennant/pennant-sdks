[package]
name = "pennant-sdk"
version = "1.1.0"
edition = "2021"
description = "Rust client for the Pennant feature-flag evaluate API"
license = "MIT"
rust-version = "1.75"
repository = "https://github.com/flypennant/pennant-sdks"
readme = "README.md"

[lib]
name = "pennant"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["json"] }
